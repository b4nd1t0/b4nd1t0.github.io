<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Spazio Personale</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
            margin: 20px;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        p {
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .stats-box {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: left;
        }
        .stats-box h3 {
            margin-top: 0;
            color: #4CAF50;
            font-size: 1.1em;
        }
        .stats-box ul {
            margin: 0;
            padding-left: 20px;
            color: #cccccc;
        }
        .btn {
            display: inline-block;
            background-color: #229ED9;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1b85ba;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Benvenuto</h1>
        <p>Uno spazio essenziale e pulito dedicato ai miei argomenti di interesse, alle risorse e agli aggiornamenti costanti.</p>
        
        <div class="stats-box">
            <h3>📊 Stato Risorse & Canale</h3>
            <ul>
                <li>Ultimo aggiornamento: <strong>Oggi</strong></li>
                <li>File e utility disponibili: <strong>Attivi</strong></li>
            </ul>
        </div>

        <a href="https://t.me/+d5RUeZRhxjVjZGFk" class="btn" target="_blank">Unisciti al Canale Telegram</a>
    </div>

</body>
</html>
